<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Language selectors -->
    <div class="row lang-row">
      <select id="source-lang" class="select">
        <option value="auto">自动检测</option>
        <option value="zh">中文</option>
        <option value="en">英语</option>
        <option value="ja">日语</option>
        <option value="ko">韩语</option>
        <option value="fr">法语</option>
        <option value="de">德语</option>
        <option value="es">西班牙语</option>
        <option value="ru">俄语</option>
        <option value="pt">葡萄牙语</option>
      </select>
      <span class="arrow">→</span>
      <select id="target-lang" class="select">
        <option value="zh">中文</option>
        <option value="en">英语</option>
        <option value="ja">日语</option>
        <option value="ko">韩语</option>
        <option value="fr">法语</option>
        <option value="de">德语</option>
        <option value="es">西班牙语</option>
        <option value="ru">俄语</option>
        <option value="pt">葡萄牙语</option>
      </select>
    </div>

    <!-- Service selector -->
    <div class="row">
      <select id="service-select" class="select full-width">
        <option value="deepseek">DeepSeek</option>
      </select>
    </div>

    <!-- Action buttons -->
    <div class="row btn-row">
      <button id="toggle-btn" class="btn btn-toggle">双语对照</button>
      <button id="translate-btn" class="btn btn-translate">翻译 (Alt+T)</button>
    </div>

    <!-- Footer -->
    <div class="row footer-row">
      <button id="settings-btn" class="btn btn-settings" title="设置">⚙ 设置</button>
      <span class="version">v1.0.0</span>
    </div>
  </div>

  <script src="../shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
